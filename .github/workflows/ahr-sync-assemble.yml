name: AHR public-safe sync assembler

on:
  push:
    branches:
      - sync-public-safe-2026-09-10
    paths:
      - .sync/READY

permissions:
  contents: write

jobs:
  assemble-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Assemble verified sanitized snapshot
        shell: python
        run: |
          import base64, hashlib, json, zipfile
          from pathlib import Path, PurePosixPath

          payload = Path('.sync')
          manifest = json.loads((payload / 'manifest.json').read_text(encoding='utf-8'))
          parts = sorted(payload.glob('archive.part.*.b64'))
          if len(parts) != int(manifest['parts']):
              raise SystemExit('payload part count mismatch')
          raw = b''.join(base64.b64decode(p.read_text(encoding='ascii').strip()) for p in parts)
          if len(raw) != int(manifest['archive_bytes']):
              raise SystemExit('archive byte count mismatch')
          if hashlib.sha256(raw).hexdigest() != manifest['archive_sha256']:
              raise SystemExit('archive sha256 mismatch')

          archive = Path('.sync/archive.zip')
          archive.write_bytes(raw)
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  rel = PurePosixPath(info.filename)
                  if rel.is_absolute() or '..' in rel.parts:
                      raise SystemExit(f'unsafe archive path: {info.filename}')
              z.extractall('.')

      - name: Public export guard
        shell: python
        run: |
          from pathlib import Path
          import re

          forbidden_names = {'.env', 'dirs.json', 'auth-audit.jsonl'}
          forbidden = [re.compile(x, re.I) for x in [r'leond', r'MyClaw', r'Netivism', r'SealShen', r'tail92', r'100\.80\.102']]
          bad = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or '.sync' in p.parts or 'node_modules' in p.parts:
                  continue
              if p.as_posix() == '.github/workflows/ahr-sync-assemble.yml':
                  continue
              rel = p.as_posix()
              if p.name in forbidden_names or '.state' in p.parts or rel.endswith('.log') or rel.endswith('.ts.net.crt') or rel.endswith('.ts.net.key'):
                  bad.append(f'forbidden path: {rel}')
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for pat in forbidden:
                  if pat.search(text):
                      bad.append(f'forbidden content {pat.pattern}: {rel}')
          if bad:
              raise SystemExit('\n'.join(bad))

      - name: Install and test public snapshot
        run: |
          npm ci
          npm test

      - name: Commit tested snapshot overlay
        shell: bash
        run: |
          git add -A
          git reset -- .sync .github/workflows/ahr-sync-assemble.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SOURCE=$(python -c "import json; print(json.load(open('.sync/manifest.json'))['source_commit'][:12])")
          git commit -m "sync: import sanitized agent-hub-remote ${SOURCE}"
          git push origin HEAD:${GITHUB_REF_NAME}
