name: AHR public-safe sync assembler

on:
  push:
    branches:
      - sync-public-safe-2026-09-10
    paths:
      - .sync/READY

permissions:
  contents: write

jobs:
  assemble-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Assemble verified sanitized snapshot
        shell: python
        run: |
          import base64, hashlib, json, urllib.request, zipfile
          from pathlib import Path, PurePosixPath

          payload = Path('.sync')
          source = json.loads((payload / 'source.json').read_text(encoding='utf-8'))
          manifest = source['manifest']
          urls = source['part_urls']
          if len(urls) != int(manifest['parts']):
              raise SystemExit('source part count mismatch')

          downloaded = []
          for index, url in enumerate(urls):
              req = urllib.request.Request(url, headers={'User-Agent': 'ahr-public-sync/1.0'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  text = response.read().decode('ascii').strip()
              base64.b64decode(text, validate=True)
              downloaded.append(text)
              (payload / f'archive.part.{index:03d}.b64').write_text(text + '\n', encoding='ascii', newline='\n')

          raw = b''.join(base64.b64decode(text) for text in downloaded)
          if len(raw) != int(manifest['archive_bytes']):
              raise SystemExit(f"archive byte count mismatch: {len(raw)} != {manifest['archive_bytes']}")
          digest = hashlib.sha256(raw).hexdigest()
          if digest != manifest['archive_sha256']:
              raise SystemExit(f"archive sha256 mismatch: {digest} != {manifest['archive_sha256']}")

          archive = payload / 'archive.zip'
          archive.write_bytes(raw)
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  rel = PurePosixPath(info.filename)
                  if rel.is_absolute() or '..' in rel.parts:
                      raise SystemExit(f'unsafe archive path: {info.filename}')
              z.extractall('.')

          (payload / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8', newline='\n')

      - name: Public export guard
        shell: python
        run: |
          from pathlib import Path
          import re

          forbidden_names = {'.env', 'dirs.json', 'auth-audit.jsonl'}
          forbidden = [re.compile(x, re.I) for x in [r'leond', r'MyClaw', r'Netivism', r'SealShen', r'tail92', r'100\.80\.102']]
          bad = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or '.sync' in p.parts or 'node_modules' in p.parts:
                  continue
              if p.as_posix() == '.github/workflows/ahr-sync-assemble.yml':
                  continue
              rel = p.as_posix()
              if p.name in forbidden_names or '.state' in p.parts or rel.endswith('.log') or rel.endswith('.ts.net.crt') or rel.endswith('.ts.net.key'):
                  bad.append(f'forbidden path: {rel}')
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for pat in forbidden:
                  if pat.search(text):
                      bad.append(f'forbidden content {pat.pattern}: {rel}')
          if bad:
              raise SystemExit('\n'.join(bad))

      - name: Install and test public snapshot
        run: |
          npm ci
          npm test

      - name: Commit tested snapshot overlay
        shell: bash
        run: |
          git add -A
          git reset -- .sync .github/workflows/ahr-sync-assemble.yml
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SOURCE=$(python -c "import json; print(json.load(open('.sync/manifest.json'))['source_commit'][:12])")
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "sync: import sanitized agent-hub-remote ${SOURCE}"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
